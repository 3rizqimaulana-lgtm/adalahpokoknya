<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Rizqi</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231a1410'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='serif' font-size='18' font-weight='700' fill='%23e8c87a'%3ER%3C/text%3E%3C/svg%3E">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --cream:#faf6f0;--sage:#7a9e7e;--rose:#c97b84;
  --gold:#c9974a;--gold-lt:#e8c87a;--dark:#1a1410;--moon:#8fa8c8;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Cormorant Garamond',serif;
  background:radial-gradient(ellipse at 20% 20%,rgba(122,158,126,.12) 0%,transparent 55%),
              radial-gradient(ellipse at 80% 80%,rgba(201,123,132,.10) 0%,transparent 55%),
              linear-gradient(160deg,#0d100c 0%,#150f0a 55%,#0a0806 100%);
  color:var(--cream);
  display:flex;flex-direction:column;
  min-height:100vh;
}

/* ===== Gerbang akses ===== */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(160deg,#0d100c 0%,#150f0a 55%,#0a0806 100%);}
#gate .card{background:rgba(20,16,12,.75);border:1px solid rgba(201,151,74,.28);border-radius:24px;
  padding:40px 32px;max-width:340px;width:100%;text-align:center;backdrop-filter:blur(18px);
  box-shadow:0 20px 60px rgba(0,0,0,.5);}
#gate .em{font-size:1.6rem;margin-bottom:10px;}
#gate h1{font-weight:500;font-size:1.3rem;color:var(--gold-lt);letter-spacing:1px;margin-bottom:18px;}
#gate input{width:100%;background:rgba(10,8,6,.7);border:1px solid rgba(201,151,74,.35);border-radius:12px;
  padding:12px 16px;text-align:center;font-family:'Space Mono',monospace;letter-spacing:5px;font-size:1rem;
  color:var(--gold-lt);outline:none;margin-bottom:14px;}
#gate input:focus{border-color:rgba(201,151,74,.7);}
#gate button{width:100%;background:rgba(201,151,74,.18);border:1px solid rgba(201,151,74,.45);color:var(--gold-lt);
  border-radius:12px;padding:11px;font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:2px;
  cursor:pointer;text-transform:uppercase;transition:background .3s;}
#gate button:hover{background:rgba(201,151,74,.3);}
#gate .err{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--rose);margin-top:10px;opacity:0;letter-spacing:1px;}
#gate .err.show{opacity:1;}

/* ===== Header ===== */
header{padding:16px 20px 0;text-align:center;}
header .eyebrow{font-family:'Space Mono',monospace;font-size:.56rem;letter-spacing:3px;color:var(--gold);margin-bottom:4px;}
header h1{font-weight:500;font-size:1.15rem;color:var(--cream);letter-spacing:.5px;}
header .sub{font-size:.75rem;color:rgba(250,246,240,.45);font-style:italic;margin-top:2px;}

/* ===== Tabs ===== */
#tabs{display:flex;gap:6px;justify-content:center;padding:14px 16px;border-bottom:1px solid rgba(201,151,74,.18);flex-wrap:wrap;}
.tab-btn{background:transparent;border:1px solid rgba(201,151,74,.25);color:rgba(250,246,240,.6);
  border-radius:30px;padding:8px 16px;font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:1px;
  cursor:pointer;transition:all .25s ease;white-space:nowrap;}
.tab-btn:hover{border-color:rgba(201,151,74,.5);color:var(--cream);}
.tab-btn.active{background:rgba(201,151,74,.2);border-color:rgba(201,151,74,.6);color:var(--gold-lt);}

/* ===== Panels ===== */
.panel{display:none;flex:1;flex-direction:column;overflow:hidden;}
.panel.active{display:flex;}

/* ===== Chat body ===== */
#chat-body{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto;width:100%;}
.bubble{max-width:78%;padding:10px 15px;border-radius:16px;font-size:.95rem;line-height:1.55;word-wrap:break-word;white-space:pre-wrap;position:relative;}
.bubble .meta{display:block;font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:1px;color:rgba(250,246,240,.4);margin-top:5px;}
.bubble.naffa{align-self:flex-start;background:rgba(122,158,126,.16);border:1px solid rgba(122,158,126,.28);}
.bubble.rizqi{align-self:flex-end;background:rgba(201,151,74,.18);border:1px solid rgba(201,151,74,.3);}
.empty{margin:auto;text-align:center;font-style:italic;font-size:.85rem;color:rgba(250,246,240,.4);padding:20px;}

/* ===== Input bar (chat) ===== */
#bar{border-top:1px solid rgba(201,151,74,.18);padding:14px 16px;display:flex;gap:10px;max-width:640px;margin:0 auto;width:100%;}
#msg{flex:1;background:rgba(10,8,6,.55);border:1px solid rgba(201,151,74,.28);border-radius:14px;padding:11px 14px;
  color:var(--cream);font-family:'Cormorant Garamond',serif;font-size:.95rem;resize:none;outline:none;max-height:120px;}
#msg:focus{border-color:rgba(201,151,74,.6);}
#send{background:rgba(201,151,74,.22);border:1px solid rgba(201,151,74,.5);color:var(--gold-lt);border-radius:14px;
  padding:0 20px;font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:1px;cursor:pointer;transition:background .3s;}
#send:hover{background:rgba(201,151,74,.35);}
#send:disabled{opacity:.5;cursor:default;}

/* ===== Entry list (Ruang Hujan / Surat 2030) ===== */
.entry-list{flex:1;overflow-y:auto;padding:18px 16px 90px;max-width:640px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px;}
.entry-card{background:rgba(10,8,6,.5);border:1px solid rgba(201,151,74,.22);border-radius:16px;padding:16px 18px;position:relative;}
.entry-card .e-date{font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:1px;color:rgba(250,246,240,.4);margin-bottom:8px;}
.entry-card .e-text{font-size:.92rem;line-height:1.65;color:var(--cream);white-space:pre-wrap;}
.entry-card .e-label{font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:2px;color:var(--gold);margin:10px 0 3px;text-transform:uppercase;}
.entry-card .e-label:first-of-type{margin-top:0;}
.panel-toolbar{padding:12px 16px;display:flex;justify-content:center;border-top:1px solid rgba(201,151,74,.18);max-width:640px;margin:0 auto;width:100%;}
.save-btn{background:rgba(122,158,126,.16);border:1px solid rgba(122,158,126,.4);color:var(--sage);
  border-radius:30px;padding:9px 20px;font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:1px;
  cursor:pointer;transition:background .3s;}
.save-btn:hover{background:rgba(122,158,126,.28);}
.save-btn:disabled{opacity:.4;cursor:default;}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="em">✦</div>
    <h1>Akses Chat</h1>
    <input id="gate-input" type="password" placeholder="• • • • • •" maxlength="20" autocomplete="off">
    <button id="gate-btn">Masuk</button>
    <div class="err" id="gate-err">Kode salah, coba lagi</div>
  </div>
</div>

<header>
  <div class="eyebrow">✦ TAMAN BULAN</div>
  <h1 id="page-title">Balas Naffa</h1>
  <div class="sub" id="page-sub">tersambung langsung ke Taman Bulan</div>
</header>

<div id="tabs">
  <button class="tab-btn active" data-tab="chat">💬 Chat Diam-diam</button>
  <button class="tab-btn" data-tab="rain">🌧️ Ruang Hujan</button>
  <button class="tab-btn" data-tab="letter">✉️ Surat ke 2030</button>
</div>

<!-- ===== PANEL: CHAT ===== -->
<div class="panel active" id="panel-chat">
  <div id="chat-body"><div class="empty">Memuat percakapan…</div></div>
  <div id="bar">
    <textarea id="msg" rows="1" placeholder="Tulis balasan…"></textarea>
    <button id="send">Kirim</button>
  </div>
</div>

<!-- ===== PANEL: RUANG HUJAN ===== -->
<div class="panel" id="panel-rain">
  <div class="entry-list" id="rain-list"><div class="empty">Memuat…</div></div>
  <div class="panel-toolbar"><button class="save-btn" id="rain-save">⬇ Simpan semua sebagai teks</button></div>
</div>

<!-- ===== PANEL: SURAT KE 2030 ===== -->
<div class="panel" id="panel-letter">
  <div class="entry-list" id="letter-list"><div class="empty">Memuat…</div></div>
  <div class="panel-toolbar"><button class="save-btn" id="letter-save">⬇ Simpan semua sebagai teks</button></div>
</div>

<script>
// ===================================================================
// Kode akses gerbang — cuma penghalang ringan di sisi klien.
const ACCESS_CODE = '20052007';
// ===================================================================

const firebaseConfig = {
  apiKey:"AIzaSyBHeicloB3jNsx0iiHyhaAZGkrEV0p2GZ8",
  authDomain:"adalahpokoknya-6cabf.firebaseapp.com",
  projectId:"adalahpokoknya-6cabf",
  storageBucket:"adalahpokoknya-6cabf.firebasestorage.app",
  messagingSenderId:"40678745638",
  appId:"1:40678745638:web:8a5c0b3d4711e548c4e8e7"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ---------- Gerbang akses ----------
const gate=document.getElementById('gate');
const gateInput=document.getElementById('gate-input');
const gateBtn=document.getElementById('gate-btn');
const gateErr=document.getElementById('gate-err');
function tryEnter(){
  if(gateInput.value===ACCESS_CODE){
    gate.style.display='none';
    startChat();
    startRainList();
    startLetterList();
  }else{
    gateErr.classList.add('show');
    gateInput.value='';
  }
}
gateBtn.addEventListener('click', tryEnter);
gateInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); tryEnter(); } });
gateInput.addEventListener('input', ()=> gateErr.classList.remove('show'));

// ---------- Tab switching ----------
const titles={
  chat:['Balas Naffa','tersambung langsung ke Taman Bulan'],
  rain:['Ruang Hujan','apa yang pernah Naffa lepaskan'],
  letter:['Surat ke 2030','syukur, tujuan, dan pesan dari Naffa']
};
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    const t=titles[btn.dataset.tab];
    document.getElementById('page-title').textContent=t[0];
    document.getElementById('page-sub').textContent=t[1];
  });
});

// ---------- Chat ----------
let chatStarted=false;
function startChat(){
  if(chatStarted) return;
  chatStarted=true;
  const body=document.getElementById('chat-body');
  db.collection('live_chat').orderBy('ts','asc').onSnapshot(function(snap){
    if(snap.empty){
      body.innerHTML='<div class="empty">Belum ada pesan. Tulis sesuatu untuk memulai ✦</div>';
      return;
    }
    body.innerHTML='';
    snap.forEach(function(doc){
      const m=doc.data();
      const isRizqi=(m.sender==='rizqi');
      const row=document.createElement('div');
      row.className='bubble '+(isRizqi?'rizqi':'naffa');
      const textNode=document.createElement('span');
      textNode.textContent=m.text||'';
      row.appendChild(textNode);
      if(m.ts){
        const meta=document.createElement('span');
        meta.className='meta';
        const d=new Date(m.ts);
        if(!isNaN(d)) meta.textContent=d.toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
        row.appendChild(meta);
      }
      body.appendChild(row);
    });
    body.scrollTop=body.scrollHeight;
  }, function(err){
    body.innerHTML='<div class="empty">Gagal memuat chat — periksa koneksi.</div>';
    console.error(err);
  });
}

async function sendMsg(){
  const msgInput=document.getElementById('msg');
  const sendBtn=document.getElementById('send');
  const text=msgInput.value.trim().substring(0,500);
  if(!text) return;
  sendBtn.disabled=true;
  try{
    await db.collection('live_chat').add({
      sender:'rizqi', text:text, ts:new Date().toISOString()
    });
    msgInput.value='';
  }catch(e){ console.error(e); }
  sendBtn.disabled=false;
  msgInput.focus();
}
document.getElementById('send').addEventListener('click', sendMsg);
document.getElementById('msg').addEventListener('keydown', function(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); }
});
document.getElementById('msg').addEventListener('input', function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
});

// ---------- helper: format tanggal ----------
function fmtDate(iso){
  const d=new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleString('id-ID',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function downloadText(filename, content){
  const blob=new Blob([content], {type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// ---------- Ruang Hujan ----------
let rainEntries=[];
function startRainList(){
  const list=document.getElementById('rain-list');
  db.collection('releases').orderBy('createdAt','desc').onSnapshot(function(snap){
    if(snap.empty){
      list.innerHTML='<div class="empty">Belum ada yang dilepaskan Naffa di sini ✦</div>';
      rainEntries=[];
      return;
    }
    list.innerHTML='';
    rainEntries=[];
    snap.forEach(function(doc){
      const m=doc.data();
      rainEntries.push(m);
      const card=document.createElement('div');
      card.className='entry-card';
      const date=document.createElement('div');
      date.className='e-date';
      date.textContent=fmtDate(m.createdAt);
      const text=document.createElement('div');
      text.className='e-text';
      text.textContent=m.text||'';
      card.appendChild(date); card.appendChild(text);
      list.appendChild(card);
    });
  }, function(err){
    list.innerHTML='<div class="empty">Gagal memuat Ruang Hujan — periksa koneksi.</div>';
    console.error(err);
  });
}
document.getElementById('rain-save').addEventListener('click', function(){
  if(!rainEntries.length) return;
  const content=rainEntries.map(m=>'['+fmtDate(m.createdAt)+']\n'+(m.text||'')).join('\n\n---\n\n');
  downloadText('ruang-hujan-naffa.txt', content);
});

// ---------- Surat ke 2030 ----------
let letterEntries=[];
function startLetterList(){
  const list=document.getElementById('letter-list');
  db.collection('future_letters').orderBy('writtenAt','desc').onSnapshot(function(snap){
    if(snap.empty){
      list.innerHTML='<div class="empty">Belum ada surat yang disegel Naffa ✦</div>';
      letterEntries=[];
      return;
    }
    list.innerHTML='';
    letterEntries=[];
    snap.forEach(function(doc){
      const m=doc.data();
      letterEntries.push(m);
      const card=document.createElement('div');
      card.className='entry-card';
      const date=document.createElement('div');
      date.className='e-date';
      date.textContent='Ditulis '+fmtDate(m.writtenAt)+' · dibuka '+(m.openAt||'2030-01-01');
      card.appendChild(date);
      [['Syukur',m.syukur],['Tujuan',m.tujuan],['Pesan',m.pesan]].forEach(function(pair){
        const lbl=document.createElement('div');
        lbl.className='e-label'; lbl.textContent=pair[0];
        const txt=document.createElement('div');
        txt.className='e-text'; txt.textContent=pair[1]||'';
        card.appendChild(lbl); card.appendChild(txt);
      });
      list.appendChild(card);
    });
  }, function(err){
    list.innerHTML='<div class="empty">Gagal memuat Surat ke 2030 — periksa koneksi.</div>';
    console.error(err);
  });
}
document.getElementById('letter-save').addEventListener('click', function(){
  if(!letterEntries.length) return;
  const content=letterEntries.map(function(m){
    return 'Ditulis '+fmtDate(m.writtenAt)+' · dibuka '+(m.openAt||'2030-01-01')
      +'\n\nSyukur: '+(m.syukur||'')
      +'\n\nTujuan: '+(m.tujuan||'')
      +'\n\nPesan: '+(m.pesan||'');
  }).join('\n\n===\n\n');
  downloadText('surat-2030-naffa.txt', content);
});
</script>
</body>
</html>
